plugins {
    id 'com.android.application'
}
android {
    namespace 'com.zikos.remote'
    compileSdk 34
    defaultConfig {
        applicationId "com.zikos.remote"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

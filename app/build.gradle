plugins {
    id 'com.android.application'
}
android {
    namespace 'com.zikos.webview'
    compileSdk 34
    defaultConfig {
        applicationId "com.zikos.webview"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

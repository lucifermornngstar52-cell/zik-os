plugins {
    id 'com.android.application'
}
android {
    namespace 'com.zikos.webview'
    compileSdk 34
    defaultConfig {
        applicationId "com.zikos.webview"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def groqKey = System.getenv('GROQ_API_KEY') ?: ''
tasks.register('groqKeyAsset') {
    doLast {
        file('src/main/assets/grok.json').text = '{"key":"' + groqKey + '"}'
    }
}
preBuild.dependsOn 'groqKeyAsset'

def ghToken = System.getenv('ZIK_GH_TOKEN') ?: ''
tasks.register('ghSecretAsset') {
    doLast {
        file('src/main/assets/secret.json').text = '{"gh":"' + ghToken + '"}'
    }
}
preBuild.dependsOn 'ghSecretAsset'
